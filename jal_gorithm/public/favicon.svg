<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 22">
  <!--
    JALGORITHM favicon — chunky pixel-art J
    Black and white only. No background color.
    White fill + black outline = reads on light tabs.
    Black fill + white outline = reads on dark tabs.
    We ship one version: white J, thick black outline.
    The black outline provides contrast on light browser tabs;
    the white fill provides the letter shape on dark tabs.
  -->

  <!-- Outline — black, 8-direction 1px expansion (at translate(1,1) base) -->
  <g fill="#000000">
    <!-- translate(0,1) -->
    <g transform="translate(0 1)">
      <rect x="1" y="1" width="12" height="3"/>
      <rect x="6" y="4" width="5" height="8"/>
      <rect x="0" y="12" width="1" height="2"/>
      <rect x="6" y="12" width="5" height="2"/>
      <rect x="0" y="14" width="11" height="1"/>
      <rect x="1" y="15" width="10" height="1"/>
      <rect x="2" y="16" width="8" height="1"/>
      <rect x="3" y="17" width="6" height="1"/>
      <rect x="4" y="18" width="4" height="1"/>
    </g>
    <!-- translate(2,1) -->
    <g transform="translate(2 1)">
      <rect x="1" y="1" width="12" height="3"/>
      <rect x="6" y="4" width="5" height="8"/>
      <rect x="0" y="12" width="1" height="2"/>
      <rect x="6" y="12" width="5" height="2"/>
      <rect x="0" y="14" width="11" height="1"/>
      <rect x="1" y="15" width="10" height="1"/>
      <rect x="2" y="16" width="8" height="1"/>
      <rect x="3" y="17" width="6" height="1"/>
      <rect x="4" y="18" width="4" height="1"/>
    </g>
    <!-- translate(1,0) -->
    <g transform="translate(1 0)">
      <rect x="1" y="1" width="12" height="3"/>
      <rect x="6" y="4" width="5" height="8"/>
      <rect x="0" y="12" width="1" height="2"/>
      <rect x="6" y="12" width="5" height="2"/>
      <rect x="0" y="14" width="11" height="1"/>
      <rect x="1" y="15" width="10" height="1"/>
      <rect x="2" y="16" width="8" height="1"/>
      <rect x="3" y="17" width="6" height="1"/>
      <rect x="4" y="18" width="4" height="1"/>
    </g>
    <!-- translate(1,2) -->
    <g transform="translate(1 2)">
      <rect x="1" y="1" width="12" height="3"/>
      <rect x="6" y="4" width="5" height="8"/>
      <rect x="0" y="12" width="1" height="2"/>
      <rect x="6" y="12" width="5" height="2"/>
      <rect x="0" y="14" width="11" height="1"/>
      <rect x="1" y="15" width="10" height="1"/>
      <rect x="2" y="16" width="8" height="1"/>
      <rect x="3" y="17" width="6" height="1"/>
      <rect x="4" y="18" width="4" height="1"/>
    </g>
  </g>

  <!-- Fill — white, centered at translate(1,1) -->
  <g fill="#ffffff" transform="translate(1 1)">
    <rect x="1" y="1" width="12" height="3"/>
    <rect x="6" y="4" width="5" height="8"/>
    <rect x="0" y="12" width="1" height="2"/>
    <rect x="6" y="12" width="5" height="2"/>
    <rect x="0" y="14" width="11" height="1"/>
    <rect x="1" y="15" width="10" height="1"/>
    <rect x="2" y="16" width="8" height="1"/>
    <rect x="3" y="17" width="6" height="1"/>
    <rect x="4" y="18" width="4" height="1"/>
  </g>
</svg>
